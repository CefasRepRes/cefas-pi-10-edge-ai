model:
  architecture: resnet18
  pretrained: true
data:
  image_size:
  - 256
  - 256
  normalisation: imagenet
training:
  batch_size: 64
  epochs: 3
  learning_rate: 0.00005
  optimizer: adam
  weight_decay: 0.0001
  num_workers: 8
  val_fraction: 0.2
  seed: 1337
  early_stopping:
    enabled: true
    monitor: val_loss
    mode: min
    patience: 5
    min_delta: 0.0
    warmup_epochs: 1
  logging:
    curve_csv: training_curve.csv
    curve_png: training_curve.png
    confusion_matrix_csv: confusion_matrix.csv
    confusion_matrix_png: confusion_matrix.png
  loss:
    name: cross_entropy   # cross_entropy | focal
    focal_gamma: 2.0      # used when name == focal
  class_weighting:
    enabled: true
    minority:
      mode: bottom_k
      k: 1
      multiplier: 10.0
  threshold_calibration:
    enabled: true
    target: minority
    objective: min_cost
    fn_cost: 10.0
    fp_cost: 1.0    
output:
  model_filename: model.pt
